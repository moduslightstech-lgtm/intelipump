[project]
name = "intelipump-fdc"
version = "0.1.0"
description = "Raspberry Pi Wayne DART forecourt controller"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "pyserial>=3.5",
  "pyserial-asyncio>=0.6",
  "aiosqlite>=0.21.0",
  "sqlalchemy>=2.0.41",
  "alembic>=1.16.0",
  "paho-mqtt>=2.1.0",
  "structlog>=25.4.0",
  "greenlet>=3.5.3",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.0.0",
  "pytest-cov>=6.2.0",
  "mypy>=1.16.0",
  "ruff>=0.12.0",
  "httpx>=0.28.0",
  "pre-commit>=4.2.0",
]

[project.scripts]
intelipump-fdc = "intelipump_fdc.main:run"
intelipump-simulator = "intelipump_fdc.simulator.cli:run"
intelipump-simulator-serial = "intelipump_fdc.simulator.serial_cli:run"
intelipump-controller = "intelipump_fdc.controller.cli:run"
intelipump-cloud-sync = "intelipump_fdc.cloud.cli:run"
intelipump-rs485-bench = "intelipump_fdc.hardware.cli:run"
intelipump-capture-passive = "intelipump_fdc.capture.cli_capture:run"
intelipump-decode-capture = "intelipump_fdc.capture.cli_decode:run"
intelipump-poll-bench = "intelipump_fdc.bench_poll.cli:run"
intelipump-continuous-poll-bench = "intelipump_fdc.continuous_poll_bench.cli:run"
intelipump-real-wayne-price-dry-run = "intelipump_fdc.real_wayne_price.cli:run"
intelipump-real-wayne-price-write = "intelipump_fdc.real_wayne_price.write_cli:run"
intelipump-real-wayne-reset-write = "intelipump_fdc.real_wayne_price.reset_cli:run"
intelipump-real-wayne-authorize-write = "intelipump_fdc.real_wayne_price.authorize_cli:run"
intelipump-real-wayne-cd2-reset-write = "intelipump_fdc.real_wayne_price.cd2_reset_cli:run"
intelipump-real-wayne-cd101-request = "intelipump_fdc.real_wayne_price.cd101_cli:run"
intelipump-real-wayne-return-status-reset-write = "intelipump_fdc.real_wayne_price.return_status_reset_cli:run"
intelipump-nozio-transition-analyze = "intelipump_fdc.bench_poll.nozio_transition_cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intelipump_fdc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
  "serial_integration: requires socat/PTY virtual serial",
  "mqtt_integration: requires local Mosquitto on port 1883",
  "rs485_bench: requires two physical USB-RS485 adapters",
]

[tool.coverage.run]
source = ["src/intelipump_fdc"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["B008"]
